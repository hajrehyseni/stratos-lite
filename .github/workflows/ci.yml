name: CI

on:
  pull_request:
    branches: [main]
  # Allow running manually from the Actions tab.
  workflow_dispatch:

# Cancel superseded runs on the same PR to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Typecheck, Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Required check: the build is blocked if types don't pass.
      - name: Typecheck
        run: npm run typecheck

      # Non-blocking: surfaces lint issues without failing the PR while the
      # existing lint debt is worked down. Remove continue-on-error to enforce.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      # Required check: the build must succeed.
      - name: Build
        run: npm run build
